name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permet de lancer le build manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Generate Native Android Code (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔨 Build Android Release APK
        working-directory: android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoEcole-App-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
